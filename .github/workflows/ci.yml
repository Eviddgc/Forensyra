name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time only; no live email delivery is attempted in CI.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # .nvmrc pins the exact patch on purpose: the committed lockfile is
      # maintained by the npm bundled with it (11.6.2). npm majors disagree
      # about *optional* wasm deps — @emnapi/*, pulled in by @img/sharp-wasm32
      # and @tailwindcss/oxide-wasm32-wasi — so a `npm ci` run by a different
      # major can fail its sync check ("Missing: @emnapi/core@1.11.3"). Plain
      # `24` would track the latest 24.x, which has since moved to npm 12.
      # The lockfile itself is complete, so npm 11 and npm 12 both accept it.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Report toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
