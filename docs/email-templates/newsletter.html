<table role="presentation" width="100%" bgcolor="#081321" cellpadding="0" cellspacing="0" border="0" style="background:#081321;">
  <tr>
    <td align="center" style="padding:28px 12px;">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:480px;max-width:480px;background:#0b1a2e;border-radius:14px;overflow:hidden;border:1px solid #16324f;">
        <!-- header -->
        <tr>
          <td bgcolor="#0b1a2e" style="padding:24px 28px 20px;border-bottom:3px solid #e6b64f;">
            <div style="font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:bold;color:#f5f4f0;letter-spacing:2px;">FORENSYRA</div>
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;color:#6d84a0;letter-spacing:3px;text-transform:uppercase;padding-top:4px;">Newsletter</div>
          </td>
        </tr>
        <!-- body -->
        <tr>
          <td bgcolor="#0b1a2e" style="padding:24px 28px 6px;">
            <div style="font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#e6b64f;letter-spacing:3px;text-transform:uppercase;">New subscriber</div>
            <div style="font-family:Georgia,'Times New Roman',serif;font-size:24px;line-height:30px;color:#f5f4f0;padding-top:8px;">{{email}}</div>
          </td>
        </tr>
        <tr><td style="padding:16px 28px 0;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;">
            <tr>
              <td width="150" style="padding:6px 0;font-size:10px;color:#6d84a0;letter-spacing:2px;text-transform:uppercase;vertical-align:top;">Signed up from</td>
              <td style="padding:6px 0;font-size:13px;color:#dbe7f2;vertical-align:top;">{{source}}</td>
            </tr>
          </table>
        </td></tr>
        <!-- quick action -->
        <tr>
          <td style="padding:18px 28px 4px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td bgcolor="#e6b64f" style="border-radius:999px;">
                  <a href="mailto:{{email}}" style="display:inline-block;padding:10px 18px;font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:bold;color:#14233a;text-decoration:none;">Say hello</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <!-- footer -->
        <tr><td style="padding:22px 28px 26px;">
          <div style="border-top:1px solid #16324f;padding-top:14px;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#6d84a0;line-height:19px;">
            Sent via forensyra.com — the footer newsletter sign-up.
          </div>
        </td></tr>
      </table>
    </td>
  </tr>
</table>
